<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cafés</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 6px 10px; }
        th { background: #eee; }
    </style>
</head>
<body>
<h1>Listado de cafés</h1>
<table>
    <thead>
    <tr>
        <th>ID</th><th>Nombre</th><th>Origen</th><th>Precio venta</th>
        <th>Precio compra</th><th>Nivel de amargor</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${cafes}">
        <td><a th:href="@{/cafes/{id}(id=${c.id})}" th:text="${c.id}"></a></td>
        <td th:text="${c.nombre}"></td>
        <td th:text="${c.origen}"></td>
        <td th:text="${#numbers.formatDecimal(c.precioVenta, 1, 2)}"></td>
        <td th:text="${#numbers.formatDecimal(c.precioCompra, 1, 2)}"></td>
        <td th:text="${c.nivelAmargor}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(cafes)}"><td colspan="6">No hay cafés registrados.</td></tr>
    </tbody>
</table>
</body>
</html>
